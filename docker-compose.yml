version: '3.9'

# ============================================================
# EduSync LMS — docker-compose
# ============================================================
# Usage:
#   Development (local VIL backend):
#     cp .env.example .env.local
#     # fill in VITE_API_URL + VITE_WS_URL
#     docker compose up --build
#
#   Production build test (simulate prod container locally):
#     VITE_API_URL=https://... \
#       docker compose -f docker-compose.yml up --build
#
# Note: EduSync frontend is a React SPA served by nginx.
# All data access goes through the VIL backend API.
# ============================================================

services:
  # ── Frontend (React SPA → nginx) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    image: edusync-lms:local
    container_name: edusync-app
    ports:
      - '3000:80'
    environment:
      # These are build-time only (baked into the JS bundle by Vite).
      # Setting them here has no effect at runtime — they must be
      # passed as build args above.
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      com.edusync.service: 'frontend'
      com.edusync.environment: 'local'

  # ── Playwright E2E (run tests against the app container) ───
  # Run with: docker compose --profile e2e up --build
  e2e:
    profiles: ['e2e']
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    container_name: edusync-e2e
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:80
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    command: ['pnpm', 'test:e2e', '--reporter=html']

# ── Networks ────────────────────────────────────────────────
networks:
  default:
    name: edusync-network
