name: Evidence Collector

on:
  pull_request:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create evidence artifacts
        run: |
          mkdir -p artifacts/release/latest
          echo "dummy" > artifacts/release/latest/security-summary.md
          echo "dummy" > artifacts/release/latest/coverage-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: artifacts/release/latest/security-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: artifacts/release/latest/coverage-summary.json
