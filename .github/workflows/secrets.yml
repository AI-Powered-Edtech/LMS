name: Secret Scanning
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gunakan filesystem scan agar tidak perlu base/head git diff
      # (menghindari error BASE==HEAD pada push single-commit / force-push).
      # Pin ke tag stabil, bukan @main yang rolling.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.35
        with:
          path: ./
          extra_args: --only-verified
