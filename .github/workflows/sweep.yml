name: Sweep Regression Gate

on:
  pull_request:
    branches: [main]

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edusync-api/target
          key: cargo-${{ runner.os }}-${{ hashFiles('edusync-api/Cargo.lock') }}

      - name: Apply database schema and migrations
        run: |
          psql "$DATABASE_URL" -f edusync-api/schema/baseline.sql
          for m in edusync-api/migrations/*.sql; do
            echo "Applying $m"
            psql "$DATABASE_URL" -f "$m"
          done

      - name: Build Rust API server
        run: cd edusync-api && cargo build --release

      - name: Start Rust API server
        run: |
          cd edusync-api && ./target/release/api-server &
          npx --yes wait-on http://localhost:8080/api/v1/health -t 60000

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start frontend dev server
        run: |
          npm run dev &
          npx --yes wait-on http://localhost:5173 -t 60000

      - name: Run sweep
        run: npx playwright test tests/e2e/sweep.spec.ts --reporter=line

      - name: Run a11y gate
        run: npx playwright test tests/e2e/a11y.spec.ts --workers=1 --reporter=line

      - name: Restore baseline from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:.qa-sweep-baseline.json > .qa-sweep-baseline.json 2>/dev/null \
            || echo '[]' > .qa-sweep-baseline.json

      - name: Diff against baseline
        run: node scripts/sweep-diff.mjs .qa-sweep-baseline.json .qa-sweep

      - name: Upload sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-reports
          path: .qa-sweep/
