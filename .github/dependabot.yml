# Dependabot configuration for EduSync LMS
# Automatically creates PRs for outdated dependencies
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm (pnpm compatible)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
    groups:
      # Group minor + patch updates into single PR to reduce noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate for careful review
    # Ignore packages that need manual migration
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps):"
