<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="EduSync LMS — Sistem Manajemen Pembelajaran untuk sekolah Indonesia"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <!-- ⚡ Perf: Preconnect to external origins (domain agnostic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ⚡ Perf: Non-render-blocking Google Fonts.
         Before: <link rel="stylesheet"> blocked FCP by 500-800ms waiting for font CSS.
         After: fonts load async via media="print" swap trick, FCP paints immediately with fallback. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>EduSync LMS</title>

    <!-- ⚡ Perf: Inline critical CSS for the loading skeleton.
         This renders instantly (FCP) before React JS downloads/parses/executes.
         React will replace #root innerHTML on mount, removing this skeleton. -->
    <style>
      #app-skeleton {
        display: flex;
        height: 100dvh;
        overflow: hidden;
        background: #020617; /* slate-950 */
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #app-skeleton .sidebar {
        width: 260px;
        background: #0f172a; /* slate-900 */
        border-right: 1px solid #1e293b;
        padding: 20px 16px;
        display: none;
      }
      #app-skeleton .main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #app-skeleton .header {
        height: 64px;
        background: #0f172a;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      #app-skeleton .content {
        flex: 1;
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #app-skeleton .pulse {
        background: #1e293b;
        border-radius: 12px;
        animation: skeleton-pulse 1.5s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      /* Show sidebar on desktop */
      @media (min-width: 768px) {
        #app-skeleton .sidebar {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- ⚡ Inline skeleton: visible in <16ms, replaced when React mounts -->
      <div id="app-skeleton">
        <div class="sidebar">
          <div class="pulse" style="height: 32px; width: 140px; margin-bottom: 32px"></div>
          <div class="pulse" style="height: 20px; width: 100%; margin-bottom: 12px"></div>
          <div class="pulse" style="height: 20px; width: 80%; margin-bottom: 12px"></div>
          <div class="pulse" style="height: 20px; width: 90%; margin-bottom: 12px"></div>
          <div class="pulse" style="height: 20px; width: 70%; margin-bottom: 12px"></div>
        </div>
        <div class="main">
          <div class="header">
            <div class="pulse" style="height: 24px; width: 200px"></div>
          </div>
          <div class="content">
            <div class="pulse" style="height: 10px; width: 48px; border-radius: 50%"></div>
            <div style="color: #64748b; font-size: 14px">Memuat EduSync...</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
