[workspace]
resolver = "2"
members = [
    "crates/api-server",
    "crates/models",
    "crates/auth",
    "crates/middleware",
    "crates/services",
    "crates/integration-tests",
]

[workspace.dependencies]
vil_server = "0.2.2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "uuid", "time", "json", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
bcrypt = "0.15"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
axum = { version = "0.7", features = ["macros", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
sentry = "0.36"
sha2 = "0.10"
hex = "0.4"
governor = "0.6"
totp-rs = { version = "5", features = ["qr", "serde_support", "zeroize", "gen_secret", "otpauth"] }
time = { version = "0.3", features = ["formatting", "macros"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
url = "2"
rand = "0.8"
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls", "builder"] }
ring = "0.17"
base64 = "0.22"
printpdf = "0.7"
zip = "2"
quick-xml = "0.37"
csv = "1"
vil_conn_s3 = "0.2"
vil_ws = "0.2"
vil_server_auth = "0.2"
