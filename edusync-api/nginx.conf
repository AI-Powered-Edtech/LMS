events { worker_connections 1024; }

http {
    upstream vil_api {
        server api:8080;
    }


    server {
        listen 80;

        # ── VIL API — System / Health ─────────────────────────────────────────
        location /api/v1/health { proxy_pass http://vil_api; }
        location /api/v1/ready { proxy_pass http://vil_api; }

        # ── VIL API — Auth ───────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Phase 2: Core CRUD ─────────────────────────────────────
        location /api/v1/courses/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/data/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/rpc/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Phase 3A: AI ────────────────────────────────────────────
        location /api/v1/ai/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Phase 3B: LTI 1.3 ─────────────────────────────────────
        location /api/v1/lti/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Phase 3C: Push / WhatsApp / PDF ────────────────────────
        location /api/v1/push/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/webhooks/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/whatsapp/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/pdf/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Phase 3D: Processing ───────────────────────────────────
        location /api/v1/progress {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/quiz/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/grading/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/scorm/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /api/v1/import/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── VIL API — Internal / Observability ───────────────────────────────
        location /_vil/ { proxy_pass http://vil_api; }
        location /metrics { proxy_pass http://vil_api; }
        location /health { proxy_pass http://vil_api; }
        location /ready { proxy_pass http://vil_api; }

        # ── VIL API — Phase 5: S3-compatible Object Storage ──────────────────
        # Must be BEFORE the catch-all location /
        # Large file upload support: 500MB video + overhead
        location /api/v1/storage/ {
            proxy_pass http://vil_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 550M;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
        }

        # ── VIL API — Phase 4: WebSocket Realtime ────────────────────────────
        # Must be BEFORE the catch-all location /
        location /ws {
            proxy_pass http://vil_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Phase 6: Supabase PostgREST removed ────────────────────────────────
        # All API routes are VIL-only. Unrecognised paths return 404.
        location / {
            # Phase 6: Supabase PostgREST removed. All API routes are VIL-only.
            # If you reach here, the route is not configured in VIL.
            return 404 '{"error": "Route tidak ditemukan. Semua endpoint tersedia di /api/v1/"}';
            add_header Content-Type application/json;
        }
    }
}
