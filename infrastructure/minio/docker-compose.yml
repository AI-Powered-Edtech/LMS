version: '3.9'

# Standalone MinIO for local development.
# Start with: docker compose -f infrastructure/minio/docker-compose.yml up -d
#
# Access points:
#   S3 API:   http://localhost:9000
#   Console:  http://localhost:9001  (minioadmin / minioadmin123)

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3-compatible API
      - '9001:9001' # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # One-shot container that creates the default bucket on first start.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/edusync;
        mc anonymous set download local/edusync/course-images;
        echo 'Bucket edusync sudah siap.';
      "
    restart: on-failure

volumes:
  minio_data:
